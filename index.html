<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">

<link rel="icon" href="icon.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<title>Portfolio Studio</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#11231d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Portfolio">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  color-scheme:light;
  --bg:#f3f5f4; --surface:#fff; --surface-soft:#e9edeb; --ink:#11231d; --muted:#5d6b66; --line:#d6ddda;
  --accent:#ef6b4a; --accent-soft:#ffe5de; --pos:#0b7457; --neg:#b8452a; --warn-soft:#fff3d6; --warn-line:#efd79c;
  --panel:#11231d; --panel-ink:#fff; --panel-trend:#7fe0bd;
  --c-eq:#2a78d6; --c-st:#eb6834; --c-k4:#1baf7a; --c-cc:#eda100; --c-sv:#e87ba4;
  --on-eq:#fff; --on-st:#fff; --on-k4:#11231d; --on-cc:#11231d; --on-sv:#11231d;
  --div-pos:#2a78d6; --div-neg:#e34948; --div-mid:#e4e7e5;
  --focus:#276785; --shadow:0 18px 50px rgba(20,44,35,.08);
  --r-lg:26px; --r-md:15px;
  --sans:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#101613; --surface:#17201c; --surface-soft:#202b26; --ink:#eef4f1; --muted:#aab7b1; --line:#34423c;
    --accent:#ff7f5f; --accent-soft:#482b24; --pos:#60d0aa; --neg:#ff9a80; --warn-soft:#3a3019; --warn-line:#6b5728;
    --panel:#eef4f1; --panel-ink:#11231d; --panel-trend:#0b7457;
    --c-eq:#3987e5; --c-st:#d95926; --c-k4:#199e70; --c-cc:#c98500; --c-sv:#d55181;
    --on-eq:#fff; --on-st:#fff; --on-k4:#fff; --on-cc:#11231d; --on-sv:#fff;
    --div-pos:#3987e5; --div-neg:#e66767; --div-mid:#383835;
    --focus:#76bdd9; --shadow:0 18px 50px rgba(0,0,0,.26);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101613; --surface:#17201c; --surface-soft:#202b26; --ink:#eef4f1; --muted:#aab7b1; --line:#34423c;
  --accent:#ff7f5f; --accent-soft:#482b24; --pos:#60d0aa; --neg:#ff9a80; --warn-soft:#3a3019; --warn-line:#6b5728;
  --panel:#eef4f1; --panel-ink:#11231d; --panel-trend:#0b7457;
  --c-eq:#3987e5; --c-st:#d95926; --c-k4:#199e70; --c-cc:#c98500; --c-sv:#d55181;
  --on-eq:#fff; --on-st:#fff; --on-k4:#fff; --on-cc:#11231d; --on-sv:#fff;
  --div-pos:#3987e5; --div-neg:#e66767; --div-mid:#383835;
  --focus:#76bdd9; --shadow:0 18px 50px rgba(0,0,0,.26);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);min-height:100vh}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* shell */
.app{min-height:100vh;display:grid;grid-template-columns:238px minmax(0,1fr)}
.side{position:sticky;top:0;height:100vh;padding:28px 20px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 26px;font-weight:700;font-size:16px}
.brand .mark{width:32px;height:32px;border-radius:9px;background:var(--ink);color:var(--surface);display:grid;place-items:center;flex:none}
.nav{display:grid;gap:6px}
.nav a{border-radius:11px;padding:12px 13px;min-height:44px;display:flex;align-items:center;gap:12px;color:var(--muted);font-weight:600;text-decoration:none}
.nav a:hover{background:var(--surface-soft);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--ink);color:var(--surface)}
.nav svg{width:18px;height:18px;flex:none}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding:18px 10px 0;display:grid;gap:16px}
.side-foot b{font-family:var(--mono);font-size:16px;font-weight:500}
.side-foot p{color:var(--muted);font-size:12px;line-height:1.5;margin:4px 0 0}
main{min-width:0;padding:28px clamp(16px,4vw,64px) 64px}
.wrap{max-width:1320px;margin:0 auto}
.topline{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 18px;margin-bottom:30px}
.flag{display:inline-flex;align-items:center;gap:9px;color:var(--muted);font-size:12px;font-weight:600;padding:6px 12px 6px 10px;border-radius:999px;background:color-mix(in srgb,var(--c,var(--accent)) 13%,transparent);border:1px solid color-mix(in srgb,var(--c,var(--accent)) 35%,transparent)}
.flag::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 22%,transparent)}
.flag b{color:var(--ink)}
.flag.real{--c:var(--pos)} .flag.sample{--c:var(--c-cc);text-decoration:none}
a.flag.sample:hover b{text-decoration:underline}
html.locked .app,html.locked .mnav{visibility:hidden}
html.veiled .app,html.veiled .mnav,html.veiled dialog{filter:blur(18px)}
#lock{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px;background:var(--bg)}
#lock[hidden]{display:none}
.lock-card{display:grid;justify-items:center;gap:10px;max-width:340px;text-align:center}
.lock-card h2{margin:6px 0 0;font-size:20px}
.lock-card p{margin:0;color:var(--muted);font-size:13.5px}
.lock-card .lock-msg{color:var(--neg)}
.lock-mark{width:52px;height:52px;border-radius:14px;background:var(--ink);color:var(--surface);display:grid;place-items:center}
.lock-btn{margin-top:10px;min-width:200px;justify-content:center}
.lock-out{margin-top:18px;border:0;background:none;color:var(--muted);font:inherit;font-size:12px;text-decoration:underline;cursor:pointer}
.chip.eye{display:inline-grid;place-items:center;padding:0;width:34px;height:31px;cursor:pointer;color:var(--ink)}
.chip.eye svg{width:17px;height:17px}
.chip.eye[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip{font-family:var(--mono);color:var(--muted);font-size:11px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.chip.live::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--pos);margin-right:7px;vertical-align:1px}
.chip.busy::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:7px;vertical-align:1px;animation:pulse 1s infinite alternate}
@keyframes pulse{to{opacity:.25}}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 26px;margin-bottom:22px}
h1{font-size:clamp(26px,3.2vw,40px);line-height:1.05;letter-spacing:-.04em;margin:8px 0 0;max-width:860px;font-weight:600}
h2{font-size:clamp(20px,2.2vw,28px);line-height:1.1;letter-spacing:-.03em;margin:0;font-weight:600}
h3{font-size:14px;margin:0}
p{line-height:1.55}
.actions{display:flex;gap:9px;flex-wrap:wrap}
.btn{min-height:42px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 15px;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.sm{min-height:36px;padding:0 11px;font-size:12px;font-weight:600}
.btn.danger{color:var(--neg)}
.btn[disabled]{opacity:.5;cursor:default}
.btn svg{width:15px;height:15px}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md)}
.pad{padding:22px}
.section{margin-top:44px}
.section-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px;margin-bottom:18px}
.section-head p{color:var(--muted);font-size:13px;margin:0;max-width:520px}
.banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;background:var(--warn-soft);border:1px solid var(--warn-line);border-radius:12px;margin-bottom:24px}
.banner p{margin:0;flex:1 1 320px;font-size:13px}
.note{font-size:12px;line-height:1.6;color:var(--muted);margin:14px 2px 0;max-width:820px}
.empty{padding:34px 22px;text-align:center;color:var(--muted)}

/* overview */
.ledger{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(250px,.85fr) minmax(0,1.35fr);gap:clamp(20px,3vw,48px);background:var(--panel);color:var(--panel-ink);padding:clamp(20px,2.6vw,34px);border-radius:20px;box-shadow:var(--shadow)}
.ledger::after{content:"";position:absolute;width:130px;height:130px;border:24px solid var(--accent);border-radius:50%;right:-78px;top:-96px;opacity:.88;pointer-events:none}
.ledger .eyebrow{color:currentColor;opacity:.62}
.big{font-size:clamp(32px,3.8vw,48px);letter-spacing:-.05em;line-height:1;margin:10px 0 10px;font-weight:600;font-variant-numeric:tabular-nums}
.trend{display:inline-flex;flex-wrap:wrap;align-items:center;gap:7px;color:var(--panel-trend);font-size:13px;font-weight:700}
.trend.down{color:var(--accent)}
.trend span{color:var(--panel-ink);opacity:.7;font-weight:500}
.ledger-right{align-self:end;position:relative;z-index:1;min-width:0;padding-right:clamp(0px,3vw,36px)}
.bar-labels{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 20px;font-size:12px;margin-bottom:10px}
.bar-labels span{opacity:.7}
.bal-bar{display:flex;height:18px;border-radius:4px;overflow:hidden;background:color-mix(in srgb,var(--panel-ink) 16%,transparent)}
.legend{margin-top:18px;display:flex;flex-wrap:wrap;gap:12px 24px}
.legend-item{display:flex;align-items:center;gap:8px;font-size:12px;opacity:.85}
.dot{width:9px;height:9px;border-radius:2px;background:var(--c);flex:none}
.acct-layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,.7fr);gap:18px}
.acct-list{overflow:hidden}
.acct-row{display:grid;grid-template-columns:42px minmax(150px,1fr) minmax(90px,.5fr) minmax(110px,auto);gap:15px;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);text-decoration:none;min-height:72px}
.acct-row:last-child{border-bottom:0}
.acct-row:hover{background:color-mix(in srgb,var(--accent) 5%,transparent)}
.glyph{width:36px;height:36px;display:grid;place-items:center;background:var(--surface-soft);border-radius:9px}
.glyph svg{width:18px;height:18px}
.acct-name b{display:block;font-size:14px}
.acct-name span{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.acct-val{font-weight:700;font-size:14px;text-align:right;font-variant-numeric:tabular-nums}
.track{height:6px;background:var(--surface-soft);border-radius:4px;overflow:hidden}
.track i{display:block;width:var(--w);height:100%;background:var(--c);border-radius:inherit}
.stack{display:grid;gap:18px;align-content:start}
.insight{padding:22px}
.insight.emph{background:var(--accent-soft);border-color:transparent}
.insight p{color:var(--muted);font-size:13px;margin:8px 0 16px}
.tape{display:flex;align-items:center;gap:12px;margin-top:14px;padding:0 0 0 14px;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.tape-asof{flex:none;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.02em;white-space:nowrap}
.tape-view{flex:1;min-width:0;overflow:hidden;height:100%;-webkit-mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent)}
.tape-track{display:flex;width:max-content;height:100%;animation:tape linear infinite}
.tape:hover .tape-track,.tape:focus-within .tape-track{animation-play-state:paused}
.tape-run{display:flex;align-items:center}
@keyframes tape{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tp{display:inline-flex;align-items:baseline;gap:7px;padding:0 18px;height:100%;align-items:center;white-space:nowrap;color:inherit;text-decoration:none;font-size:13px;font-variant-numeric:tabular-nums;border-right:1px solid var(--line)}
.tp:hover b{text-decoration:underline}
.tp-lab{font-size:11px;color:var(--muted);font-weight:600}
.tp-px{color:var(--muted)}
.tp .pos,.tp .neg{font-weight:700;font-size:12px}
@media (prefers-reduced-motion: reduce){.tape-track{animation:none}.tape-dup{display:none}.tape-view{overflow-x:auto;-webkit-mask-image:none;mask-image:none}}
.mv-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.mv-head .muted{font-size:12px}
.mv-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.mv{display:grid;gap:4px;align-content:start;padding:12px;border-radius:10px;background:var(--surface-soft);color:inherit;text-decoration:none;min-width:0}
a.mv:hover{outline:1px solid var(--line)}
.mv-line{display:flex;justify-content:space-between;align-items:baseline;gap:6px;flex-wrap:wrap}
.mv-tk{font-size:19px;letter-spacing:-.02em}
.mv-line .pos,.mv-line .neg{font-size:14px;font-variant-numeric:tabular-nums}
.mv .sub{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.mv.empty{align-content:start}
.insight p.mv-foot{margin:12px 0 0}
.metric{font-size:28px;letter-spacing:-.04em;font-weight:600;margin-top:6px;font-variant-numeric:tabular-nums}
.timeline{position:relative;margin-top:16px;padding-left:18px}
.timeline::before{content:"";position:absolute;left:3px;top:4px;bottom:5px;width:1px;background:var(--line)}
.tl{position:relative;padding:0 0 16px}
.tl:last-child{padding-bottom:0}
.tl::before{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:var(--accent);left:-18px;top:5px;box-shadow:0 0 0 4px var(--surface)}
.tl b{display:block;font-size:13px}
.tl span{color:var(--muted);font-size:12px}

/* charts */
svg text{font-family:var(--mono)}
.ax{fill:var(--muted);font-size:11px}
.grid{stroke:var(--line);stroke-width:1}
.c-area{fill:var(--accent-soft)}
.c-line{fill:none;stroke:var(--accent);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.c-dot{fill:var(--surface);stroke:var(--accent);stroke-width:3}
.f-st{fill:var(--c-st)} .f-k4{fill:var(--c-k4)} .f-cc{fill:var(--c-cc)} .f-eq{fill:var(--c-eq)}

/* stocks */
.stock-sum{display:grid;grid-template-columns:minmax(260px,.75fr) minmax(0,1.25fr);gap:16px;margin-bottom:18px}
.stock-intro{background:var(--panel);color:var(--panel-ink);border-radius:var(--r-md);padding:20px 22px;display:flex;flex-direction:column;justify-content:space-between;gap:12px}
.stock-intro .eyebrow{color:currentColor;opacity:.62}
.si-metrics{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:end;margin-top:12px}
.si-metrics span{display:block;font-size:11px;opacity:.65;margin-bottom:7px}
.si-count,.si-total{display:block;line-height:.95;letter-spacing:-.05em;font-weight:600;font-variant-numeric:tabular-nums}
.si-count{font-size:clamp(30px,3.4vw,40px)}
.si-total{font-size:clamp(22px,2.4vw,28px)}
.stock-intro p{font-size:12px;margin:0;opacity:.72}
.keys{padding:18px 20px;display:grid;align-content:center}
.key-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px 16px;margin-top:12px}
.key{padding-left:12px;border-left:2px solid var(--c)}
.key b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.key span{display:block;margin-top:4px;color:var(--muted);font-size:12px}
.panel{overflow:hidden}
.panel-head{padding:20px 22px 16px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 18px}
.panel-head p{margin:5px 0 0;color:var(--muted);font-size:12px}
.toolbar{padding:10px 18px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 16px;align-items:center;border-top:1px solid var(--line);background:var(--surface-soft)}
.toolbar p{margin:0;color:var(--muted);font-size:12px}
.toolbar label{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.tsplit{padding:12px 22px 14px;border-top:1px solid var(--line)}
.tsplit-bar{height:8px}
.tsplit-items{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:10px;font-size:12.5px;font-variant-numeric:tabular-nums}
.tsplit-it{display:inline-flex;align-items:center;gap:7px}
.tsplit-it>span{color:var(--muted)}
.tsplit-it em{font-style:normal;font-size:11px;color:var(--muted);opacity:.8}
.tsplit-it small{color:var(--muted);font-size:11.5px}
select.mini{min-height:34px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 8px;font-size:12px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-size:10px;font-weight:500;text-align:left;padding:12px 12px;background:var(--surface-soft);border-top:1px solid var(--line);white-space:nowrap}
td{padding:12px;font-size:13px;border-top:1px solid var(--line);vertical-align:middle}
th.num,td.num{text-align:right;white-space:nowrap}
tfoot td{border-top:2px solid var(--ink);font-weight:700}
td.act{white-space:nowrap;text-align:right}
th.sort{padding:0}
th.sort button{width:100%;min-height:40px;border:0;background:transparent;color:inherit;padding:0 12px;text-align:inherit;font:inherit;text-transform:inherit;letter-spacing:inherit;cursor:pointer}
th.sort button:hover{color:var(--ink)}
th[aria-sort="ascending"] button::after{content:" ↑";color:var(--accent)}
th[aria-sort="descending"] button::after{content:" ↓";color:var(--accent)}
tbody tr:hover{background:color-mix(in srgb,var(--accent) 4%,transparent)}
.tk{font-family:var(--mono);font-weight:500;font-size:14px}
.tk-cell{display:flex;align-items:center;gap:10px}
.logo{position:relative;flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:11px;overflow:hidden;font-family:var(--mono);font-weight:700;font-size:14px;letter-spacing:-.02em;color:var(--ink);background:color-mix(in srgb,var(--c) 22%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 35%,transparent)}
.logo.l3{font-size:12px}.logo.l4{font-size:10.5px}.logo.l5{font-size:9px;letter-spacing:-.04em}
.logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;padding:3px;opacity:0}
.logo img.ok{opacity:1}
.logo.sm{width:28px;height:28px;border-radius:8px;font-size:10.5px}.logo.sm.l3{font-size:9px}.logo.sm.l4{font-size:8px}.logo.sm.l5{font-size:6.5px}
.phone-only,.hcards,.ac-phone,.pj-phone{display:none}
.tag{display:inline-block;margin-top:4px;font-size:10px;font-family:var(--mono);padding:2px 6px;border-radius:5px;background:var(--surface-soft);color:var(--muted);white-space:nowrap}
.tag.warn{background:var(--accent-soft);color:var(--neg);cursor:help}
.subline{display:block;font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap}
input.price{width:108px;min-height:38px;border:1px solid var(--line);border-radius:8px;padding:0 9px;background:var(--surface);text-align:right;font-family:var(--mono);font-size:13px}
input.price:hover{border-color:var(--muted)}
input.price.flash{animation:flash 1.2s ease-out}
@keyframes flash{from{background:color-mix(in srgb,var(--pos) 25%,var(--surface))}}
.na{color:var(--muted);font-style:italic}

/* accounts */
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;margin-bottom:26px}
.strip>div{background:var(--surface);padding:18px 20px}
.strip span{color:var(--muted);font-size:12px;display:block;margin-bottom:8px}
.strip b{font-size:21px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.tabs{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.tab{flex:1 1 150px;min-height:44px;text-align:left;padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:flex;flex-direction:column;gap:2px}
.tab .l{font-size:12px;color:var(--muted)}
.tab .v{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.tab[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.tab[aria-pressed="true"] .l{color:inherit;opacity:.7}
.stats{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:18px}
.stat{flex:1 1 180px;padding:14px 18px}
.stat span{display:block;font-size:12px;color:var(--muted)}
.stat b{display:block;font-size:20px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}

/* projections */
.proj{display:grid;grid-template-columns:310px minmax(0,1fr);gap:18px;align-items:start}
.controls{padding:22px;position:sticky;top:24px}
.controls h3{margin-bottom:16px}
.cg{padding:16px 0;border-top:1px solid var(--line)}
.cg:first-of-type{border-top:0;padding-top:0}
.cl{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-bottom:10px}
.cl label,.cl span{font-size:12px;color:var(--muted)}
.cl b{font-family:var(--mono);font-size:12px;font-weight:500}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface-soft);padding:4px;border-radius:10px}
.seg button{border:0;background:transparent;min-height:36px;padding:0 4px;border-radius:7px;font-size:12px;cursor:pointer;color:var(--muted);font-weight:700}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}
input[type="range"]{width:100%;accent-color:var(--accent);min-height:28px}
.ni{width:100%;min-height:40px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--surface);font-family:var(--mono);font-size:13px}
.check{display:flex;align-items:center;gap:10px;min-height:40px;font-size:13px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.proj-main{display:grid;gap:18px;min-width:0}
.chart-card{padding:clamp(18px,3vw,28px);min-width:0}
.chart-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:14px 20px;align-items:flex-start}
.pv span{display:block;color:var(--muted);font-size:12px}
.pv b{display:block;font-size:clamp(28px,4vw,42px);letter-spacing:-.045em;margin-top:5px;font-variant-numeric:tabular-nums}
.c-legend{display:flex;gap:8px 16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:9px}
.c-legend span{display:inline-flex;align-items:center;gap:6px}
.chart-scroll{overflow-x:auto;margin-top:18px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.kpis>div{background:var(--surface);padding:16px 18px}
.kpis span{display:block;font-size:12px;color:var(--muted)}
.kpis b{display:block;font-size:19px;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.kpis small{font-size:11px;color:var(--muted)}

/* net worth history */
.seg-range{display:inline-grid;grid-auto-flow:column;grid-template-columns:none}
.seg-range button{padding:0 11px}
.hist-sum{margin:0 0 10px;font-size:13px;color:var(--muted)}
.c-dot.man{fill:var(--accent)}
.c-hit{fill:transparent}
.c-hit:hover{fill:var(--accent)}

/* CD maturity */
.ladder{margin-top:18px;padding-bottom:18px;overflow:hidden}
.lad-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.lad-stats>div{background:var(--surface);padding:14px 22px}
.lad-stats span{display:block;font-size:12px;color:var(--muted)}
.lad-stats b{display:block;font-size:20px;font-weight:600;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.lad-stats em{font-style:normal;font-size:12px;color:var(--muted)}
.lad-chart{margin:16px 22px 10px}
.lad-year{font-weight:500;fill:var(--ink)}
.lad-bar{fill:var(--c-cc)} .lad-soon{fill:var(--accent)} .lad-empty{fill:var(--line)}
@media (max-width:680px){.lad-stats{grid-template-columns:1fr}.lad-chart{margin:14px 16px 8px}}
.tl-act{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
#dlgIntro{margin:0;font-size:13px;color:var(--muted)}

/* retirement goal */
.goal{padding:22px 24px;display:grid;gap:14px}
.goal-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:10px 16px}
.goal h2{font-size:20px;margin-top:6px}
.goal p{margin:0;font-size:13px;color:var(--muted)}
.goal p b{color:var(--ink)}
.goal .goal-note{font-size:12px}
.status{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;white-space:nowrap}
.status.ok{color:var(--pos);background:color-mix(in srgb,var(--pos) 12%,transparent)}
.status.short{color:var(--neg);background:var(--accent-soft)}
.goal-nums{display:flex;flex-wrap:wrap;gap:8px 36px;align-items:flex-end}
.goal-nums span{display:block;font-size:12px;color:var(--muted)}
.goal-nums b{display:block;font-size:28px;letter-spacing:-.035em;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.goal-nums b.muted{font-size:20px;color:var(--muted)}
.goal-bar{height:10px;border-radius:5px;overflow:hidden;background:var(--surface-soft)}
.goal-bar i{display:block;height:100%;background:var(--accent);border-radius:inherit}
.goal-bar i.ok{background:var(--pos)}
.metric.pos{color:var(--pos)} .metric.neg{color:var(--neg)}

/* taxes */
.pv .pv-tax{margin-top:6px;font-size:12px;color:var(--muted)}
.pv .pv-tax b{display:inline;font-size:13px;margin:0;letter-spacing:0;color:var(--neg)}
.at-line{margin-top:16px;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.at-line span{display:block;font-weight:400;opacity:.65;font-size:12px;margin-top:3px}
.blk-tax{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:baseline;padding:10px 12px;border-radius:9px;background:var(--surface-soft)}
.blk-tax span{font-size:12px;color:var(--muted)}
.blk-tax b{font-size:16px;font-variant-numeric:tabular-nums}
.blk-tax em{grid-column:1 / -1;font-style:normal;font-size:11px;color:var(--muted)}
.blk-tax-sum{margin:12px 0 0;font-size:13px;color:var(--muted)}
.blk-tax-sum b{color:var(--ink);font-variant-numeric:tabular-nums}

/* projections by account */
.seg-view{display:inline-grid;grid-template-columns:repeat(2,auto)}
.seg-view button{padding:0 14px}
.seg2{grid-template-columns:repeat(2,1fr)}
.blocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:18px;align-items:start}
.blk{padding:20px 22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.blk-head{display:flex;align-items:center;gap:12px}
.blk-head h3{font-size:16px}
.blk-head div span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.pill{margin-left:auto;align-self:flex-start;font-family:var(--mono);font-size:11px;padding:4px 8px;border-radius:6px;background:var(--surface-soft);white-space:nowrap}
.blk-nums{display:flex;align-items:flex-end;flex-wrap:wrap;gap:6px 14px}
.blk-nums span{display:block;font-size:11px;color:var(--muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em}
.blk-nums b{display:block;font-size:28px;letter-spacing:-.035em;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.blk-nums b.sm{font-size:18px;color:var(--muted);font-weight:500}
.blk-nums .arrow{font-size:18px;color:var(--muted);text-transform:none;font-family:var(--sans);padding-bottom:3px}
.blk-nums .mult{margin-left:auto;font-size:12px;font-weight:700;color:var(--pos);background:color-mix(in srgb,var(--pos) 12%,transparent);padding:4px 8px;border-radius:6px;text-transform:none;letter-spacing:0}
.blk-nums .mult.down{color:var(--neg);background:var(--accent-soft)}
.spark{width:100%;height:72px;display:block}
.sp-area{fill:color-mix(in srgb,var(--c) 16%,transparent)}
.sp-line{fill:none;stroke:var(--c);stroke-width:2.5;stroke-linejoin:round}
.blk-split{display:grid;gap:10px}
.split{display:flex;height:10px;border-radius:4px;overflow:hidden;background:var(--surface-soft)}
.split-legend{display:grid;gap:4px}
.split-legend div{display:grid;grid-template-columns:auto 1fr auto 40px;gap:8px;align-items:center;font-size:12px;min-height:22px}
.split-legend span{color:var(--muted)}
.split-legend b{font-weight:600;font-variant-numeric:tabular-nums}
.split-legend em{font-style:normal;color:var(--muted);text-align:right;font-family:var(--mono);font-size:11px}
.facts{margin:0;padding:12px 0 0;border-top:1px solid var(--line);list-style:none;display:grid;gap:6px;font-size:12px;color:var(--muted);line-height:1.5}
.facts li{padding-left:14px;position:relative}
.facts li::before{content:"";position:absolute;left:2px;top:7px;width:5px;height:5px;border-radius:50%;background:var(--c)}
.facts strong{color:var(--ink)}
.blk details{margin-top:auto;border-top:1px solid var(--line);padding-top:6px}
.blk summary{cursor:pointer;font-size:12px;font-weight:700;min-height:34px;display:flex;align-items:center;gap:6px;list-style:none}
.blk summary::-webkit-details-marker{display:none}
.blk summary::before{content:"";width:6px;height:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
.blk details[open] summary::before{transform:rotate(45deg)}
table.mini th{padding:8px 10px;font-size:9px}
table.mini td{padding:7px 10px;font-size:12px}

/* insights */
.ins{margin-top:40px}
.ins:first-of-type{margin-top:0}
.ins-card{padding:22px}
.wi-grid{display:grid;grid-template-columns:290px minmax(0,1fr);gap:26px;align-items:start}
.wi-controls .cg:first-child{padding-top:0;border-top:0}
.wi-out{min-width:0}
.ins-h3{font-size:15px;margin:20px 0 4px}
.ins-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
.ins-stats>div{background:var(--surface);padding:14px 16px}
.ins-stats span{display:block;font-size:12px;color:var(--muted)}
.ins-stats b{display:block;font-size:22px;font-weight:600;margin:4px 0 2px}
.ins-stats em{font-style:normal;font-size:12px;color:var(--muted)}
.viz-legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;font-size:12px;color:var(--muted);margin:8px 0 10px}
.viz-legend span{display:inline-flex;align-items:center;gap:6px}
.lk-area{width:12px;height:12px;border-radius:3px;background:var(--c);display:inline-block}
.lk-line{width:16px;height:2px;border-radius:1px;background:var(--c);display:inline-block}
.gain-key{display:inline-block;width:140px;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--div-neg),var(--div-mid),var(--div-pos))}
.viz-tip{position:fixed;z-index:40;display:none;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:10px 12px;font-size:12px;min-width:170px;max-width:300px}
.vt-head{font-weight:600;color:var(--muted);margin-bottom:6px}
.vt-row{display:grid;grid-template-columns:14px 1fr auto;gap:8px;align-items:center;padding:2px 0}
.vt-row i{width:14px;height:2px;border-radius:1px;background:var(--muted)}
.vt-row span{color:var(--muted)}
.vt-row b{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.xh-line{stroke:var(--muted);stroke-width:1;display:none}
.xh-hit{fill:transparent;cursor:crosshair;touch-action:pan-y}
.band{fill:var(--surface-soft)}
.band-lab{fill:var(--muted);font-size:11px}
.mk-line{stroke:var(--muted);stroke-width:1}
.mk-lab{fill:var(--ink);font-size:11px;font-weight:600}
.tgt-line{stroke:var(--ink);stroke-width:2}
.tgt-dot{fill:var(--ink);stroke:var(--surface);stroke-width:2}
.lever{cursor:default;outline:none}
.lever:focus-visible .lever-bar,.lever:hover .lever-bar{filter:brightness(1.1)}
.lever-bar{fill:var(--div-pos)}
.lever-lab{fill:var(--ink);font-size:13px}
.lever-lab,.lever-val,.mk-lab,.band-lab,.tm text,.tl-title,.tl-sub{font-family:var(--sans)}
.tl-bg{fill:var(--surface)}
.lever-val{fill:var(--ink);font-size:12px;font-weight:600}
.tm-tile{cursor:pointer;outline:none}
.tm-tile:hover rect,.tm-tile:focus-visible rect{filter:brightness(1.1)}
.tm-tile:focus-visible rect{stroke:var(--ink);stroke-width:2}
.tm-head{fill:var(--ink);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:600;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.ins-toolbar{display:flex;flex-wrap:wrap;gap:10px 16px;justify-content:space-between;align-items:center;margin-bottom:8px}
.tl-axis{stroke:var(--ink);stroke-width:2}
.tl-tick{stroke:var(--muted);stroke-width:1}
.tl-lead{stroke:var(--line);stroke-width:1}
.tl-dot{fill:var(--ink);stroke:var(--surface);stroke-width:2}
.tl-retire .tl-dot{fill:var(--accent)}
.tl-warn .tl-dot{fill:var(--neg)}
.tl-today .tl-dot{fill:var(--surface);stroke:var(--ink)}
.tl-m{outline:none;cursor:default}
.tl-m:focus-visible .tl-dot{stroke:var(--focus);stroke-width:3}
.tl-title{fill:var(--ink);font-size:12.5px;font-weight:600}
.tl-sub{fill:var(--muted);font-size:11px}
.timeline .tl-retire::before{background:var(--accent)}
.wf-up{fill:var(--div-pos)} .wf-down{fill:var(--div-neg)} .wf-total{fill:var(--muted)}
.wf-zero{stroke:var(--ink);stroke-width:1}
.wf-link{stroke:var(--muted);stroke-width:1}
.wf-bar{outline:none}
.wf-bar:hover rect:nth-child(2),.wf-bar:focus-visible rect:nth-child(2){filter:brightness(1.1)}
.wf-head b{font-size:20px;font-weight:600;margin-right:8px}
.wf-head span{font-size:13px;color:var(--muted)}
details.tbl{margin-top:10px}
details.tbl summary{cursor:pointer;font-size:12px;font-weight:700;min-height:34px;display:flex;align-items:center}
details.tbl table{font-size:12px}
@media (max-width:980px){.wi-grid{grid-template-columns:1fr}}
@media (max-width:680px){.ins-stats{grid-template-columns:1fr}.ins-card{padding:16px}.mnav a{font-size:9px}}

/* settings */
.set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:18px;align-items:start}
.set-card{padding:24px;display:grid;gap:16px}
.set-card h2{font-size:20px}
.set-card p{margin:0;color:var(--muted);font-size:13px}
.field{display:grid;gap:6px}
.field>label,.field>.lab{font-size:12px;font-weight:600;color:var(--muted)}
.field input:not([type="checkbox"]),.field select{min-height:42px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--surface)}
.field .hint{font-size:12px;color:var(--muted)}
.inline{display:flex;gap:8px;flex-wrap:wrap}
.inline>input{flex:1 1 200px;min-width:0}
.backups{list-style:none;margin:0;padding:0;display:grid;gap:6px;max-height:320px;overflow:auto}
.backups li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:9px;background:var(--surface-soft)}
.backups li div{display:grid;gap:2px;min-width:0;font-size:13px}
.backups li .muted{font-size:12px}
.status-line{font-size:13px;padding:10px 12px;border-radius:9px;background:var(--surface-soft)}
.status-line.ok{color:var(--pos)}
.status-line.bad{color:var(--neg);background:var(--accent-soft)}
.seg-theme{display:inline-grid;grid-template-columns:repeat(3,auto)}

/* dialog + toast */
dialog{border:1px solid var(--line);border-radius:16px;padding:0;width:min(480px,calc(100vw - 32px));background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,20,16,.5)}
dialog form{padding:24px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 40px);overflow:auto}
dialog h2{font-size:20px}
.dlgbtns{display:flex;justify-content:flex-end;gap:10px;margin-top:6px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:12px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100vw - 32px);z-index:30;font-size:13px}
#toast.show{opacity:1}
.mnav{display:none}

@media (max-width:980px){
  .app{grid-template-columns:80px minmax(0,1fr)}
  .side{padding:24px 12px}
  .brand span:last-child,.nav a span,.side-foot{display:none}
  .brand{justify-content:center;padding:2px 0 22px}
  .nav a{justify-content:center;padding:13px}
  .ledger,.acct-layout,.stock-sum,.proj{grid-template-columns:1fr}
  .stack{grid-template-columns:1fr 1fr}
  .controls{position:static}
}
@media (max-width:680px){
  body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
  .app{display:block}
  .side{display:none}
  main{padding:18px 16px 30px}
  .topline [data-feed-chip]{display:none}
  /* Projections on a phone: Today-vs-final card and compact year rows instead of the KPI cards and table. */
  .pj-desk{display:none!important}
  .pj-phone{display:grid;gap:14px}
  .pj-cmp{padding:16px}
  .pj-grid{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px 14px;align-items:baseline;font-size:13px;font-variant-numeric:tabular-nums}
  .pj-grid>span:not(.pj-l),.pj-grid>b{text-align:right;white-space:nowrap}
  .pj-grid>span:not(.pj-l){color:var(--muted)}
  .pj-h{font-size:11px;font-weight:700;color:var(--muted)}
  .pj-l{display:flex;align-items:center;gap:8px;min-width:0}
  .pj-rule{grid-column:1/-1;height:1px;background:var(--line)}
  .pj-net{font-weight:700;color:var(--ink)!important}
  b.pj-net{font-size:15px}
  .pj-years{padding:0;overflow:hidden}
  .pj-yr{border-top:1px solid var(--line)}
  .pj-row{display:grid;grid-template-columns:minmax(0,1fr) auto 18px;grid-template-areas:"when nw chev" "bar dlt chev";gap:6px 12px;align-items:center;width:100%;padding:11px 14px 11px 16px;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
  .pj-row:active,.pj-yr.open>.pj-row{background:var(--surface-soft)}
  .pj-when{grid-area:when;display:flex;align-items:baseline;gap:8px;font-size:13px}
  .pj-when span{color:var(--muted);font-size:12px}
  .pj-when .tag{font-size:9px}
  .pj-nw{grid-area:nw;text-align:right;font-variant-numeric:tabular-nums;font-size:14px}
  .pj-row .ac-chev{grid-area:chev}
  .pj-yr.open .ac-chev{transform:rotate(90deg);color:var(--ink)}
  .pj-bar{grid-area:bar;display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--surface-soft)}
  .pj-yr.open .pj-bar{background:var(--surface)}
  .pj-bar span{height:100%}
  .pj-dlt{grid-area:dlt;text-align:right;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
  .pj-det{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:4px 48px 14px 16px;background:var(--surface-soft);font-size:12.5px;font-variant-numeric:tabular-nums}
  .pj-det span{color:var(--muted)}
  /* Accounts on a phone: balance-sheet card and an accordion instead of the strip, tabs and table. */
  .ac-desk{display:none}
  .ac-phone{display:grid;gap:14px}
  .ac-bs{padding:16px}
  .ac-bs-top{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--muted);margin-bottom:10px}
  .ac-bs-top b{font-size:16px;color:var(--ink);margin-left:4px}
  .ac-bs-top b.neg{color:var(--neg)}
  .ac-bs-rows{display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin-top:12px;font-size:13px;font-variant-numeric:tabular-nums}
  .ac-bs-rows>span{display:flex;align-items:center;gap:8px;color:var(--muted)}
  .ac-bs-rule{grid-column:1/-1;height:1px;background:var(--line);margin:2px 0}
  .ac-bs-net{font-weight:700;color:var(--ink)!important}
  .ac-list{padding:0;overflow:hidden}
  .ac-cat+.ac-cat{border-top:1px solid var(--line)}
  .ac-row{display:grid;grid-template-columns:36px minmax(0,1fr) auto 18px;gap:12px;align-items:center;width:100%;padding:14px 14px 14px 16px;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
  .ac-row:active{background:var(--surface-soft)}
  .ac-name{display:grid;gap:2px;min-width:0}
  .ac-name b{font-size:14px}
  .ac-name span{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ac-total{font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .ac-chev{width:18px;height:18px;color:var(--muted);transition:transform .2s}
  .ac-cat.open .ac-chev{transform:rotate(90deg);color:var(--ink)}
  .ac-cat.open>.ac-row{background:var(--surface-soft)}
  .ac-body{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;padding:10px 12px 14px;background:var(--surface-soft)}
  .ac-cat.open .glyph{background:var(--surface)}
  .ac-item{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .ac-item-main{display:grid;gap:3px;width:100%;padding:12px 14px;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
  .ac-item-main:active{background:var(--surface-soft)}
  .ac-item-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13.5px}
  .ac-item-top b:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ac-item-val{flex:none;font-variant-numeric:tabular-nums}
  .ac-item-sub{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .ac-item-acts{display:flex;gap:8px;padding:0 14px 12px}
  .ac-add{padding:12px;border:1px dashed var(--line);border-radius:12px;background:none;color:var(--ink);font:inherit;font-weight:700;font-size:13px;cursor:pointer}
  .ac-ladder{min-width:0}
  .ac-ladder>*{margin:4px 0 0}
  /* Stocks on a phone: cards instead of the table. */
  .st-toolbar{flex-wrap:nowrap;padding:8px 16px}
  .st-toolbar p{flex:1;min-width:0;display:flex}
  .st-toolbar .chip{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .st-toolbar label{flex:none}
  .tsplit{padding:12px 16px}
  .tsplit-items{display:grid;grid-template-columns:auto 1fr auto auto;gap:6px 10px}
  .tsplit-it{display:contents}
  .tsplit-it b,.tsplit-it small{text-align:right}
  .st-table,.desk-only{display:none}
  .phone-only{display:inline}
  .panel-head .phone-only{display:block}
  .panel-head>div:first-child{flex:1 1 240px}
  .hcards{display:block;border-top:1px solid var(--line)}
  .hc-bar{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:10px 16px;font-size:12px;color:var(--muted)}
  .hc{display:flex;gap:12px;align-items:center;width:100%;padding:12px 16px;border:0;border-top:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
  .hc:active{background:var(--surface-soft)}
  .hc.flash{animation:flash 1.2s ease-out}
  .hc-main{flex:1;min-width:0;display:grid;gap:3px}
  .hc-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:12.5px;font-variant-numeric:tabular-nums}
  .hc-row>span:last-child,.hc-row>b{flex:none;white-space:nowrap}
  .hc-tk{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-weight:700;font-size:15px;min-width:0}
  .hc-tk .tag{font-family:var(--sans,inherit);font-size:9px}
  .hc-val{font-size:15px}
  .hc-co{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
  .hc-sub{color:var(--muted);font-size:12px}
  .hc-row .pos,.hc-row .neg{font-weight:700}
  .phone-only .hc-sum{display:grid;gap:3px;margin-top:6px;font-size:12.5px;font-variant-numeric:tabular-nums}
  .hc-sum-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .hc-sum-top b{font-size:18px;color:var(--ink)}
  .hc-hint{font-size:11.5px;color:var(--muted);margin-top:2px}
  /* Phone: data indicator and save status share one row; the indicator drops its extra words, the status trims to fit. */
  .topline{flex-wrap:nowrap;margin-bottom:22px}
  .topline .flag{flex:none}
  .flag .flag-x{display:none}
  .topline .actions{flex:1 1 auto;min-width:0;justify-content:flex-end;flex-wrap:nowrap}
  .topline [data-save-status]{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ledger{padding:22px 20px;border-radius:18px;gap:24px}
  .ledger::after{width:150px;height:150px;border-width:28px;right:-95px;top:-90px}
  .big{font-size:36px}
  .section{margin-top:34px}
  .acct-row{grid-template-columns:36px minmax(0,1fr) auto;padding:14px 16px;gap:12px}
  .acct-row .track{display:none}
  .stack{grid-template-columns:1fr}
  .strip,.kpis{grid-template-columns:1fr 1fr}
  .tab{flex-basis:calc(50% - 5px)}
  .proj{display:flex;flex-direction:column}
  .controls{order:2;width:100%}
  .proj-main{order:1;width:100%}
  table.rt,.rt tbody,.rt tfoot,.rt tr,.rt td{display:block;width:100%}
  .rt thead{display:none}
  table.rt{min-width:0!important}
  .rt tbody tr,.rt tfoot tr{display:grid;padding:12px 16px;border-top:1px solid var(--line)}
  .rt td{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:4px 0;border:0;text-align:right}
  .rt td::before{content:attr(data-label);color:var(--muted);font-family:var(--mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase;text-align:left}
  .rt td.lead{display:block;text-align:left;padding-bottom:6px}
  .rt td.lead::before,.rt td.act::before,.rt td.blank{display:none}
  .rt td.act{display:flex;gap:8px;justify-content:flex-end;padding-top:8px}
  .rt tfoot td{border:0}
  .mnav{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;z-index:20;left:0;right:0;bottom:0;padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--surface) 94%,transparent);border-top:1px solid var(--line);backdrop-filter:blur(8px)}
  .mnav a{min-height:48px;padding:6px 2px;color:var(--muted);display:grid;gap:3px;place-items:center;font-size:10px;text-decoration:none}
  .mnav a[aria-current="page"]{color:var(--accent);font-weight:700}
  .mnav svg{width:19px;height:19px}
}
@media (max-width:390px){
  .strip,.kpis,.si-metrics{grid-template-columns:1fr}
  .actions .btn{flex:1}
}
@media (prefers-reduced-motion:reduce){.spin,.chip.busy::before,input.price.flash{animation:none}}
@media print{.side,.mnav,.btn,.toolbar,#toast,.banner{display:none!important}.app{display:block}}
</style>
</head>
